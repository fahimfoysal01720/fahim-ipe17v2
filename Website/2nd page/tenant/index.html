<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

</head>
<body>
<div class="full-page">
<div class="navbar">
        
<div><a href="index.html"><h1>Nirr</h1></a>
<!---- this is for the logo you can place a img here---->
</div></div>
<div class="main-content">
    <button class="btn loginbtn" onclick="document.getElementById('login-form').style.display='block'">
        Tenant's Login or Registration
    </button>
</div>
    <div id='login-form' class="login-page">
    <!----creating the form-box---->
    

                
<div class="form-box">
<div class='button-box'>
<div id='btn'></div>
<button type='button'
onclick='login()'class='toggle-btn'>Login</button>
<button type='button'onclick='register()'class='toggle-btn'>Register</button>
</div>
<!---creating login form----->
<form id='login' class='input-group-login'>

<input type='text'class='input-field'placeholder='Email Id' required>
<input type='password'class='input-field'placeholder='Enter Password' required>
<input type='checkbox'class='check-box'><span>Remember Password</span><button type='submit' class='submit-btn'>Log in</button>
 </form>
<!-----Creating the registration form---->
                          
    <form id='register'class='input-group-register'>
    <input type='text' class='input-field'placeholder='First Name' required>
                          
    <input type='text' class='input-field'placeholder='Last Name' required>
    
    <input type='email' class='input-field'placeholder='Email Id' required>
    
    <input type='password' class='input-field'placeholder='Enter Password' required>
                          
    <input type='password' class='input-field'placeholder='Confirm Password' required>
                 
        <input type='checkbox'class='check-box'><span>I agree to the terms and conditions</span> 
        <button type="submit" class='submit-btn'>Register</button>
                    </form>
                    <!----now lets style the for the form page----> 
                    
</div>
</div>
</div>
<!----the first script code is for login and registration form to move correctly---->
<script>
var x=document.getElementById('login');
var y=document.getElementById('register');
var z=document.getElementById('btn');
    function register()
    {
        x.style.left='-400px';
        y.style.left='50px';
        z.style.left='110px';
    }
    function login()
    {
        x.style.left='50px';
        y.style.left='450px';
        z.style.left='0px';
    }
    
     </script>
     <!----- this code is for the when i click out rhe login or reg page the form -box dissappeaes---->
    
     <script>
var modal = document.getElementById('login-form');
         window.onclick = function(event)
         {
             if (event.target == modal)
                 {
                     modal.style.display = "none";
                 }
         }
         
    </script>
    <!---let us run and see---->


</body>
